# PanHub 纯静态前台 nginx 配置
#
# 缓存策略说明：本工程构建产物文件名**固定不打 hash**（见 vite.config.ts，
# 为了「丢到任何静态托管就能跑」），因此不能用 immutable 长缓存——发版后
# 浏览器会一直用旧文件。统一 no-cache（协商缓存）：每次询问 ETag，
# 文件没变只回 304，开销极小且发版即时生效。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 单页应用：/daily 与 query（?q=）都走前端；
    # try_files 兜底回 index.html，刷新子路径不 404
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # gzip：app.js / style.css 文本压缩收益明显
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 基础安全头
    add_header X-Content-Type-Options "nosniff" always;

    # 隐藏以点开头的文件（.git 之类不该出现在产物里，防御性拦截）
    location ~ /\. {
        deny all;
    }
}
