<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>星盘搜 · 改版预览</title>
  <link rel="icon" href="./logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="preview-banner">静态预览 · mock 数据 · <strong>星盘搜</strong> 改版（不连真实 API）</div>

  <div class="app" id="app">
    <!-- ========== HOME ========== -->
    <div class="view is-active" id="view-home" data-view="home">
      <main class="main">
        <div class="home-hero">
          <div class="brand">
            <img class="brand__logo" src="./logo.svg" width="72" height="72" alt="" />
            <h1 class="brand__name">星盘搜</h1>
            <p class="brand__tag">聚合网盘资源搜索 · 不存储任何文件</p>
          </div>

          <form class="search-wrap" id="home-search-form" autocomplete="off">
            <div class="search-box">
              <span class="search-box__icon" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
                </svg>
              </span>
              <input
                class="search-box__input"
                id="home-kw"
                name="kw"
                type="search"
                placeholder="搜索网盘资源：电影、软件、课程…"
                aria-label="搜索关键词"
              />
              <button type="button" class="search-box__clear" id="home-clear" aria-label="清空" title="清空">✕</button>
              <button type="submit" class="search-box__btn">搜索</button>
            </div>
          </form>
        </div>

        <section class="section" aria-label="热门关键词">
          <h2 class="section__title">热门搜索</h2>
          <div class="hot-list" id="hot-list"></div>
        </section>

        <section class="section" aria-label="精选资源">
          <h2 class="section__title">精选资源</h2>
          <div class="curated-list" id="curated-list"></div>
        </section>
      </main>

      <footer class="site-footer">
        <p>星盘搜 · 聚合搜索，不存储任何文件</p>
        <p>本站仅提供搜索索引，资源来自公开分享链接；请遵守相关法律法规与网盘服务条款。</p>
      </footer>
    </div>

    <!-- ========== RESULTS ========== -->
    <div class="view" id="view-results" data-view="results">
      <div class="results-top">
        <button type="button" class="results-top__logo" id="back-home" title="返回首页">
          <img src="./logo.svg" width="36" height="36" alt="" />
          <span>星盘搜</span>
        </button>
        <form class="search-wrap" id="results-search-form" autocomplete="off">
          <div class="search-box">
            <span class="search-box__icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
              </svg>
            </span>
            <input
              class="search-box__input"
              id="results-kw"
              name="kw"
              type="search"
              placeholder="搜索网盘资源…"
              aria-label="搜索关键词"
            />
            <button type="button" class="search-box__clear" id="results-clear" aria-label="清空" title="清空">✕</button>
            <button type="submit" class="search-box__btn">搜索</button>
          </div>
        </form>
      </div>

      <div class="results-main">
        <div class="stats-bar" id="stats-bar" hidden>
          <span>找到约 <strong id="stat-total">0</strong> 条结果</span>
          <span>用时 <strong id="stat-time">0.3</strong>s</span>
        </div>

        <div class="filters" id="filters" hidden></div>

        <div class="loading" id="loading" hidden>正在搜索…</div>
        <div class="empty" id="empty" hidden>
          <h3>未找到相关资源</h3>
          <p>试试其他关键词，或返回首页换个热词</p>
        </div>
        <ul class="result-list" id="result-list"></ul>
      </div>

      <footer class="site-footer">
        <p>星盘搜 · 聚合搜索，不存储任何文件</p>
        <p>本站仅提供搜索索引，资源来自公开分享链接；请遵守相关法律法规与网盘服务条款。</p>
      </footer>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="./app.js"></script>
</body>
</html>
